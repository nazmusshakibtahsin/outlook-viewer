<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outlook Viewer - Email Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            @apply transition-colors duration-200;
        }

        body {
            @apply bg-background text-foreground;
        }

        .shadcn-btn {
            @apply inline-flex items-center justify-center gap-2 px-4 py-2 rounded-md font-medium transition-all duration-200;
            @apply focus:outline-none focus:ring-2 focus:ring-offset-2;
        }

        .btn-primary {
            @apply bg-primary text-primary-foreground hover:bg-primary/90;
            @apply focus:ring-primary;
        }

        .btn-secondary {
            @apply bg-secondary text-secondary-foreground hover:bg-secondary/80;
            @apply focus:ring-secondary;
        }

        .btn-destructive {
            @apply bg-destructive text-destructive-foreground hover:bg-destructive/90;
            @apply focus:ring-destructive;
        }

        .btn-ghost {
            @apply bg-transparent text-foreground hover:bg-accent hover:text-accent-foreground;
        }

        .btn-outline {
            @apply border border-input bg-background hover:bg-accent hover:text-accent-foreground;
        }

        .shadcn-card {
            @apply bg-card text-card-foreground rounded-lg border border-border shadow-sm;
        }

        .shadcn-input {
            @apply flex h-10 w-full rounded-md border border-input bg-background px-3 py-2 text-sm;
            @apply placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2;
        }

        .shadcn-badge {
            @apply inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold;
        }

        .badge-default {
            @apply bg-secondary text-secondary-foreground;
        }

        .badge-success {
            @apply bg-green-100 text-green-800;
        }

        .badge-destructive {
            @apply bg-red-100 text-red-800;
        }

        .badge-warning {
            @apply bg-yellow-100 text-yellow-800;
        }

        .email-grid {
            display: grid;
            gap: 1rem;
        }

        @media (max-width: 640px) {
            .email-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (min-width: 641px) and (max-width: 1024px) {
            .email-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1025px) {
            .email-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        background: 'hsl(var(--background))',
                        foreground: 'hsl(var(--foreground))',
                        primary: 'hsl(var(--primary))',
                        'primary-foreground': 'hsl(var(--primary-foreground))',
                        secondary: 'hsl(var(--secondary))',
                        'secondary-foreground': 'hsl(var(--secondary-foreground))',
                        destructive: 'hsl(var(--destructive))',
                        'destructive-foreground': 'hsl(var(--destructive-foreground))',
                        muted: 'hsl(var(--muted))',
                        'muted-foreground': 'hsl(var(--muted-foreground))',
                        accent: 'hsl(var(--accent))',
                        'accent-foreground': 'hsl(var(--accent-foreground))',
                        border: 'hsl(var(--border))',
                        input: 'hsl(var(--input))',
                        ring: 'hsl(var(--ring))',
                        card: 'hsl(var(--card))',
                        'card-foreground': 'hsl(var(--card-foreground))',
                    },
                }
            }
        }
    </script>
    <style>
        :root {
            --background: 0 0% 100%;
            --foreground: 0 0% 3.6%;
            --primary: 0 0% 9%;
            --primary-foreground: 0 0% 100%;
            --secondary: 0 0% 96.1%;
            --secondary-foreground: 0 0% 9%;
            --destructive: 0 84.2% 60.2%;
            --destructive-foreground: 0 0% 100%;
            --muted: 0 0% 96.1%;
            --muted-foreground: 0 0% 45.1%;
            --accent: 0 0% 9%;
            --accent-foreground: 0 0% 100%;
            --border: 0 0% 89.8%;
            --input: 0 0% 89.8%;
            --ring: 0 0% 3.6%;
            --card: 0 0% 100%;
            --card-foreground: 0 0% 3.6%;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: 0 0% 3.6%;
                --foreground: 0 0% 98.2%;
                --primary: 0 0% 98.2%;
                --primary-foreground: 0 0% 9%;
                --secondary: 0 0% 14.9%;
                --secondary-foreground: 0 0% 98.2%;
                --destructive: 0 86.1% 61.2%;
                --destructive-foreground: 0 0% 14.9%;
                --muted: 0 0% 14.9%;
                --muted-foreground: 0 0% 63.9%;
                --accent: 0 0% 98.2%;
                --accent-foreground: 0 0% 9%;
                --border: 0 0% 14.9%;
                --input: 0 0% 14.9%;
                --ring: 0 0% 83.1%;
                --card: 0 0% 9%;
                --card-foreground: 0 0% 98.2%;
            }
        }
    </style>
</head>
<body class="bg-background text-foreground">
    <div class="min-h-screen">
        <!-- Header -->
        <header class="bg-card border-b border-border sticky top-0 z-50 shadow-sm">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                    <div class="flex items-center gap-3">
                        <div class="bg-primary text-primary-foreground p-2 rounded-lg">
                            <i class="fas fa-envelope text-lg"></i>
                        </div>
                        <div>
                            <h1 class="text-2xl sm:text-3xl font-bold">Outlook Viewer</h1>
                            <p class="text-xs sm:text-sm text-muted-foreground">Email management</p>
                        </div>
                    </div>
                    <div class="flex flex-wrap items-center justify-center gap-2">
                        <button id="refreshBtn" class="shadcn-btn btn-secondary">
                            <i class="fas fa-sync-alt"></i>
                            <span class="hidden sm:inline">Refresh</span>
                        </button>
                        <button id="settingsBtn" class="shadcn-btn btn-ghost">
                            <i class="fas fa-cog"></i>
                            <span class="hidden sm:inline">Settings</span>
                        </button>
                        <a href="admin/" class="shadcn-btn btn-outline">
                            <i class="fas fa-shield"></i>
                            <span class="hidden sm:inline">Admin</span>
                        </a>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <!-- Toolbar -->
            <div class="shadcn-card p-4 mb-6">
                <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 flex-wrap">
                    <div class="flex items-center gap-2 w-full sm:w-auto">
                        <input type="checkbox" id="selectAllBtn" class="w-5 h-5 rounded cursor-pointer">
                        <label for="selectAllBtn" class="text-sm font-medium cursor-pointer">Select All</label>
                        <span id="selectedCount" class="text-sm text-muted-foreground ml-2">(0 selected)</span>
                    </div>
                    
                    <div class="flex flex-wrap items-center gap-2 w-full sm:w-auto">
                        <!-- Search -->
                        <div class="relative flex-1 sm:flex-initial">
                            <input type="text" id="searchBox" placeholder="Search emails..." class="shadcn-input w-full sm:w-64">
                            <i class="fas fa-search absolute right-3 top-3 text-muted-foreground"></i>
                        </div>

                        <!-- Filter Dropdown -->
                        <select id="filterSelect" class="shadcn-input px-3 py-2">
                            <option value="">All Emails</option>
                            <option value="unread">Unread</option>
                            <option value="flagged">Flagged</option>
                            <option value="recent">Recent</option>
                        </select>

                        <!-- Bulk Actions -->
                        <button id="bulkDeleteBtn" class="shadcn-btn btn-destructive disabled:opacity-50" disabled>
                            <i class="fas fa-trash"></i>
                            <span class="hidden sm:inline">Delete</span>
                        </button>
                        <button id="bulkMarkBtn" class="shadcn-btn btn-secondary disabled:opacity-50" disabled>
                            <i class="fas fa-flag"></i>
                            <span class="hidden sm:inline">Flag</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Loading State -->
            <div id="loadingState" class="text-center py-12">
                <div class="inline-block">
                    <i class="fas fa-spinner fa-spin text-4xl text-primary mb-4"></i>
                    <p class="text-muted-foreground mt-4">Loading emails...</p>
                </div>
            </div>

            <!-- Email Grid -->
            <div id="emailGrid" class="email-grid" style="display: none;">
                <!-- Emails will be loaded here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="text-center py-12" style="display: none;">
                <i class="fas fa-inbox text-6xl text-muted mb-4"></i>
                <p class="text-muted-foreground text-lg">No emails found</p>
            </div>
        </main>
    </div>

    <!-- Email Modal -->
    <div id="emailModal" class="hidden fixed inset-0 bg-black/50 z-50 overflow-y-auto">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="shadcn-card max-w-2xl w-full max-h-[90vh] overflow-y-auto">
                <div class="sticky top-0 bg-secondary px-6 py-4 flex justify-between items-center border-b">
                    <h2 id="modalTitle" class="text-xl font-bold"></h2>
                    <button onclick="closeModal()" class="text-foreground hover:text-muted-foreground">
                        <i class="fas fa-times text-2xl"></i>
                    </button>
                </div>
                <div class="p-6">
                    <div id="modalContent"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Sample data - Replace with actual API calls to Outlook
        const sampleEmails = [
            {
                id: 1,
                from: "john@example.com",
                subject: "Meeting Tomorrow",
                preview: "Hi, I wanted to confirm our meeting tomorrow at 2 PM...",
                date: "Today 2:30 PM",
                unread: true,
                flagged: false,
                body: "Hi, I wanted to confirm our meeting tomorrow at 2 PM. Please let me know if you can make it."
            },
            {
                id: 2,
                from: "sarah@company.com",
                subject: "Project Update",
                preview: "The project is on track. Here's the latest status report...",
                date: "Today 1:15 PM",
                unread: false,
                flagged: true,
                body: "The project is on track. Here's the latest status report with all the details..."
            },
            {
                id: 3,
                from: "notifications@github.com",
                subject: "Your PR has been merged",
                preview: "Your pull request #123 has been successfully merged...",
                date: "Yesterday 9:45 AM",
                unread: false,
                flagged: false,
                body: "Your pull request #123 has been successfully merged into the main branch."
            },
            {
                id: 4,
                from: "team@company.com",
                subject: "Team Lunch Plans",
                preview: "Let's plan our team lunch for next Friday...",
                date: "Yesterday 3:20 PM",
                unread: true,
                flagged: false,
                body: "Let's plan our team lunch for next Friday. Any preferences?"
            },
            {
                id: 5,
                from: "admin@company.com",
                subject: "System Maintenance Notice",
                preview: "System maintenance scheduled for Sunday at midnight...",
                date: "2 days ago",
                unread: false,
                flagged: false,
                body: "System maintenance scheduled for Sunday at midnight. Expected downtime: 2 hours."
            },
            {
                id: 6,
                from: "newsletter@site.com",
                subject: "Weekly Newsletter",
                preview: "This week's top stories and updates...",
                date: "3 days ago",
                unread: false,
                flagged: false,
                body: "This week's top stories and updates from around the web..."
            }
        ];

        let emails = [...sampleEmails];
        let selectedEmails = new Set();

        // Initialize
        function init() {
            loadEmails();
            setupEventListeners();
        }

        // Setup Event Listeners
        function setupEventListeners() {
            document.getElementById('selectAllBtn').addEventListener('change', toggleSelectAll);
            document.getElementById('searchBox').addEventListener('input', filterEmails);
            document.getElementById('filterSelect').addEventListener('change', filterEmails);
            document.getElementById('refreshBtn').addEventListener('click', refreshEmails);
            document.getElementById('bulkDeleteBtn').addEventListener('click', bulkDelete);
            document.getElementById('bulkMarkBtn').addEventListener('click', bulkMark);
        }

        // Load and Display Emails
        function loadEmails() {
            const grid = document.getElementById('emailGrid');
            grid.innerHTML = '';

            if (emails.length === 0) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('emptyState').style.display = 'block';
                return;
            }

            emails.forEach(email => {
                const emailCard = createEmailCard(email);
                grid.appendChild(emailCard);
            });

            document.getElementById('loadingState').style.display = 'none';
            document.getElementById('emailGrid').style.display = 'grid';
        }

        // Create Email Card
        function createEmailCard(email) {
            const card = document.createElement('div');
            const isSelected = selectedEmails.has(email.id);
            
            card.className = `shadcn-card p-4 cursor-pointer hover:shadow-md border-l-4 ${isSelected ? 'border-l-primary bg-secondary' : 'border-l-transparent'}`;
            
            card.innerHTML = `
                <div class="flex gap-3">
                    <input type="checkbox" class="email-checkbox w-5 h-5 flex-shrink-0 rounded cursor-pointer mt-1" data-id="${email.id}" ${isSelected ? 'checked' : ''}>
                    <div class="flex-1 min-w-0 cursor-pointer" onclick="openEmailModal(${email.id})">
                        <div class="flex items-start justify-between gap-2">
                            <div class="flex-1 min-w-0">
                                <p class="font-semibold text-foreground truncate">${escapeHtml(email.from)}</p>
                                <p class="text-sm ${email.unread ? 'font-bold text-foreground' : 'text-muted-foreground'} line-clamp-2">${escapeHtml(email.subject)}</p>
                                <p class="text-xs text-muted-foreground mt-1 line-clamp-2">${escapeHtml(email.preview)}</p>
                            </div>
                            <div class="flex-shrink-0 text-right space-y-1">
                                ${email.unread ? '<span class="shadcn-badge badge-default"><i class="fas fa-circle-dot"></i> New</span>' : ''}
                                ${email.flagged ? '<i class="fas fa-flag text-yellow-500"></i>' : ''}
                            </div>
                        </div>
                        <p class="text-xs text-muted-foreground mt-2">${email.date}</p>
                    </div>
                </div>
            `;

            card.querySelector('.email-checkbox').addEventListener('change', (e) => {
                e.stopPropagation();
                toggleEmailSelection(email.id);
            });

            return card;
        }

        // Toggle Email Selection
        function toggleEmailSelection(emailId) {
            if (selectedEmails.has(emailId)) {
                selectedEmails.delete(emailId);
            } else {
                selectedEmails.add(emailId);
            }
            updateSelectionUI();
        }

        // Toggle Select All
        function toggleSelectAll(e) {
            if (e.target.checked) {
                emails.forEach(email => selectedEmails.add(email.id));
            } else {
                selectedEmails.clear();
            }
            updateSelectionUI();
        }

        // Update Selection UI
        function updateSelectionUI() {
            const count = selectedEmails.size;
            document.getElementById('selectedCount').textContent = `(${count} selected)`;
            document.getElementById('bulkDeleteBtn').disabled = count === 0;
            document.getElementById('bulkMarkBtn').disabled = count === 0;
            
            // Update checkboxes
            document.querySelectorAll('.email-checkbox').forEach(checkbox => {
                const id = parseInt(checkbox.dataset.id);
                checkbox.checked = selectedEmails.has(id);
            });

            // Update select all checkbox
            const selectAllBtn = document.getElementById('selectAllBtn');
            selectAllBtn.checked = selectedEmails.size > 0 && selectedEmails.size === emails.length;

            // Reload to show visual feedback
            loadEmails();
        }

        // Filter Emails
        function filterEmails() {
            const searchTerm = document.getElementById('searchBox').value.toLowerCase();
            const filterType = document.getElementById('filterSelect').value;

            emails = sampleEmails.filter(email => {
                const matchesSearch = !searchTerm || 
                    email.from.toLowerCase().includes(searchTerm) ||
                    email.subject.toLowerCase().includes(searchTerm) ||
                    email.preview.toLowerCase().includes(searchTerm);

                const matchesFilter = !filterType ||
                    (filterType === 'unread' && email.unread) ||
                    (filterType === 'flagged' && email.flagged) ||
                    (filterType === 'recent' && email.date.includes('Today'));

                return matchesSearch && matchesFilter;
            });

            loadEmails();
        }

        // Bulk Delete
        function bulkDelete() {
            if (confirm(`Delete ${selectedEmails.size} email(s)?`)) {
                sampleEmails = sampleEmails.filter(e => !selectedEmails.has(e.id));
                selectedEmails.clear();
                filterEmails();
            }
        }

        // Bulk Mark
        function bulkMark() {
            sampleEmails.forEach(email => {
                if (selectedEmails.has(email.id)) {
                    email.flagged = !email.flagged;
                }
            });
            selectedEmails.clear();
            filterEmails();
        }

        // Refresh Emails
        function refreshEmails() {
            const btn = document.getElementById('refreshBtn');
            btn.disabled = true;
            btn.querySelector('i').classList.add('fa-spin');
            
            setTimeout(() => {
                btn.disabled = false;
                btn.querySelector('i').classList.remove('fa-spin');
                alert('Emails refreshed!');
            }, 1500);
        }

        // Open Email Modal
        function openEmailModal(emailId) {
            const email = sampleEmails.find(e => e.id === emailId);
            if (!email) return;

            document.getElementById('modalTitle').textContent = email.subject;
            document.getElementById('modalContent').innerHTML = `
                <div class="space-y-4">
                    <div class="border-b pb-4">
                        <p class="text-sm font-semibold text-muted-foreground">From:</p>
                        <p class="text-foreground">${escapeHtml(email.from)}</p>
                    </div>
                    <div class="border-b pb-4">
                        <p class="text-sm font-semibold text-muted-foreground">Date:</p>
                        <p class="text-foreground">${email.date}</p>
                    </div>
                    <div class="space-y-2">
                        <p class="text-sm font-semibold text-muted-foreground">Message:</p>
                        <p class="text-foreground whitespace-pre-wrap">${escapeHtml(email.body)}</p>
                    </div>
                </div>
            `;

            document.getElementById('emailModal').classList.remove('hidden');
        }

        // Close Modal
        function closeModal() {
            document.getElementById('emailModal').classList.add('hidden');
        }

        // Escape HTML
        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        // Close modal on background click
        document.getElementById('emailModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('emailModal')) {
                closeModal();
            }
        });

        // Initialize app
        init();
    </script>
</body>
</html>
